<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk timer</title>
<meta name="description" content="A countdown you can read from a podium. Counts up once you are over.">
<meta name="theme-color" content="#10171a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- One screen, no setup step. The clock is the page; everything else gets
     out of the way once it is running. -->
<main class="stage" id="stage" data-state="idle">

  <div class="face">
    <p class="status" id="status" aria-live="polite"></p>

    <p class="clock" id="clock" role="timer" aria-live="off">30:00</p>

    <div class="track" aria-hidden="true"><div class="track__fill" id="fill"></div></div>
  </div>

  <div class="controls" id="controls">
    <div class="lengths" id="lengths" role="group" aria-label="Talk length"></div>

    <div class="custom">
      <label class="label" for="in-mins">Minutes</label>
      <input class="input input--mins" id="in-mins" type="number" min="1" max="600" step="1" value="30">
    </div>

    <div class="buttons">
      <button class="btn btn--primary btn--big" id="btn-go">Start</button>
      <button class="btn" id="btn-reset" disabled>Reset</button>
      <button class="btn btn--ghost" id="btn-full">Full screen</button>
    </div>

    <p class="keys">
      <kbd>space</kbd> start and pause &nbsp;·&nbsp;
      <kbd>R</kbd> reset, once paused &nbsp;·&nbsp;
      <kbd>F</kbd> full screen
    </p>

    <p class="note" id="note"></p>
  </div>

  <footer class="foot" id="foot">
    <a href="/tools/">&larr; Tools</a>
  </footer>

</main>

<script src="timer.js"></script>
<script src="app.js"></script>
</body>
</html>
